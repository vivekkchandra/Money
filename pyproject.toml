[project]
name = "money"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VIVEK CHANDRA", email = "vivek.chandra@arm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "crewai[tools]>=1.15.21",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "redis>=8.1.0",
    "rich>=14.3.4",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
money = "money:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
