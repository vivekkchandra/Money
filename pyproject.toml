[project]
name = "money"
version = "0.1.0"
description = "Independent multi-firm investment research with a durable control plane"
readme = "README.md"
authors = [
    { name = "VIVEK CHANDRA", email = "vivek.chandra@arm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "crewai[tools]>=1.15.21",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "quantstats>=0.0.81",
    "redis>=8.1.0",
    "rich>=14.3.4",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "ta-lib>=0.7.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]

[project.scripts]
money = "money:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["upstreams", "optional_reference", "graphify-out", "apps/web/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/money"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires TEST_DATABASE_URL to a disposable PostgreSQL database"]
