name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: money_test
          POSTGRES_USER: money_test
          POSTGRES_PASSWORD: disposable-ci-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U money_test -d money_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONEY_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://money_test:disposable-ci-database@localhost:5432/money_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/money
      - run: uv run --no-sync python scripts/validate_data_tables.py
      - run: uv run --no-sync pytest --junitxml=/tmp/money-pytest.xml
      - name: Collect bounded Python test diagnostics
        id: python-results
        if: always()
        run: python scripts/ci_diagnostics.py pytest /tmp/money-pytest.xml --github-output "$GITHUB_OUTPUT"
      - name: "Python test results: ${{ steps.python-results.outputs.summary }}"
        if: always()
        run: echo "Consult the pytest step for complete test output."
      - run: uv run --no-sync python scripts/check_deployment.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked --python 3.12
        working-directory: .
      - run: npm run test:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:commercial
      - run: npm run test:commercial:browser
      - run: uv run --no-sync python scripts/check_deployment.py
        working-directory: .

  node-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: control-plane
            extra: ""
          - runtime: research
            extra: "--extra research"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv export --locked --no-dev ${{ matrix.extra }} --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/money-locked-requirements.txt
      - run: uv tool run --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --timeout 15 --requirement /tmp/money-locked-requirements.txt --format json --output /tmp/money-audit.json
      - name: Collect bounded dependency diagnostics
        id: audit-results
        if: always()
        run: python scripts/ci_diagnostics.py audit /tmp/money-audit.json --github-output "$GITHUB_OUTPUT"
      - name: "Dependency results: ${{ steps.audit-results.outputs.summary }}"
        if: always()
        run: echo "Consult the audit step for complete advisory or retrieval errors."

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg MONEY_GIT_SHA=${{ github.sha }} --tag money-ci .
      - run: docker build --target research --build-arg MONEY_GIT_SHA=${{ github.sha }} --tag money-research-ci .
      - name: Verify default image excludes research-only dependencies
        run: docker run --rm money-ci python -c "from importlib.util import find_spec; assert find_spec('chromadb') is None; assert find_spec('crewai') is None"
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          RESEARCH_API_TOKEN: disposable-ci-token-at-least-32-characters
        run: docker compose config --quiet

  backend-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Install local PostgreSQL acceptance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Isolated migration, killed-worker recovery and backup restore
        shell: bash
        run: uv run --no-sync python scripts/backend_acceptance.py | tee /tmp/money-backend-acceptance.json
      - name: Collect bounded backend acceptance diagnostics
        id: backend-results
        if: always()
        run: python scripts/ci_diagnostics.py acceptance /tmp/money-backend-acceptance.json --github-output "$GITHUB_OUTPUT"
      - name: "Backend acceptance: ${{ steps.backend-results.outputs.summary }}"
        if: always()
        run: echo "The drill exit code remains authoritative; missing evidence is not a pass."
