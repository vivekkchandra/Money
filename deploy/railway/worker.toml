# Select only for the existing private research worker; repository root context.
# The explicit image includes locked research dependencies, not qualification.
# Native artifacts, credentials, licences and the live manifest remain mandatory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.research"

[deploy]
startCommand = "python -m money.worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = "30"
