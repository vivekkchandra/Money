services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: money
      POSTGRES_USER: money
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - money-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://money:${POSTGRES_PASSWORD}@postgres:5432/money
      MONEY_ENV: ${MONEY_ENV:-development}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  research-api:
    build: .
    environment: &research-environment
      DATABASE_URL: postgresql+psycopg://money:${POSTGRES_PASSWORD}@postgres:5432/money
      RESEARCH_API_TOKEN: ${RESEARCH_API_TOKEN:?Set RESEARCH_API_TOKEN in .env}
      MONEY_ENV: ${MONEY_ENV:-development}
      MONEY_RESEARCH_MODE: ${MONEY_RESEARCH_MODE:-unconfigured}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  research-worker:
    build: .
    environment: *research-environment
    command: ["python", "-m", "money.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  money-postgres:
